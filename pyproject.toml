[tool.pytest.ini_options]
pythonpath = "src"
# Upstream astropy/numpy>=2.4 noise from Angle.to_string (see src/vlbiplanobs/__init__.py).
filterwarnings = ["ignore:invalid value encountered in do_format:RuntimeWarning"]


[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "vlbiplanobs"
version = "5.1.0"
description = "Observation Planner for VLBI observations"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
  "astronomy",
  "astrophysics",
  "cosmology",
  "radio",
  "science",
  "observations",
  "planner",
  "coordinate",
]

authors = [{ name = "B. Marcote", email = "marcote@jive.eu" }]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "numpy",
  "astropy",
  "astroplan",
  "pyerfa",
  "rich",
  "rich_argparse",
  "plotext",
  "ortools>=9.0",
  "plotly",
  "dash>=3.0",
  "dash-bootstrap-components>=2.0",
  "dash-mantine-components",
  "kaleido<1",  # kaleido>=1 needs a Chrome binary to export figures (PDF reports break without it)
  "loguru",
  "borb==2.1.25; sys_platform == 'darwin'",  # borb 3.x wheel has case-conflicting files: fails on macOS
  "borb>=3.0; sys_platform != 'darwin'",
  "furl",
  "packaging",
]


[project.optional-dependencies]
test = ["pytest"]


[project.urls]
"Bug Reports" = "https://github.com/bmarcote/vlbi_calculator/issues"
"Source" = "https://github.com/bmarcote/vlbi_calculator/"


[tool.setuptools]
include-package-data = true


[tool.setuptools.package-data]
"vlbiplanobs.data" = ["*"]
"vlbiplanobs.gui" = ["assets/**/*"]


[tool.setuptools.packages.find]
where = ["src"]


[project.scripts]
planobs = "vlbiplanobs.cli:cli"
